name: Release

# Push a tag like v1.1.0 -> builds SysWidget.exe + Setup.exe on Windows and publishes them as a zip in a GitHub Release.
# Tag with a message: it becomes the release's short summary (what changed, in plain words, a few "- " lines), which
# the widget also shows in its "new version" notification:
#   git tag -a v1.2.3 -m "- What changed for users" -m "- Another change"
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tag, for the "Full changelog" link

      - name: Version from tag
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got ${{ github.ref_name }})" }
          "VERSION=$v" | Out-File $env:GITHUB_ENV -Append   # build.bat stamps it into both programs

      - name: Check translations
        shell: pwsh
        run: ./tools/check-lang.ps1

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          $zip = "SysWidget-${{ github.ref_name }}.zip"
          # Everything goes inside a SysWidget folder, so extracting never scatters files.
          New-Item pkg\SysWidget -ItemType Directory | Out-Null
          Copy-Item SysWidget.exe, Setup.exe, LICENSE pkg\SysWidget
          "Run Setup.exe from this folder.`r`n`r`nSysWidget by Dimokat - https://github.com/SysWidget/SysWidget" | Set-Content pkg\SysWidget\README.txt
          Compress-Archive pkg\SysWidget $zip
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # The tag's message is the summary (checkout leaves annotated tags without their message: fetch it again).
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" 2>$null
          $summary = ''
          if ((git cat-file -t "refs/tags/$tag") -eq 'tag') { $summary = ((git for-each-ref "refs/tags/$tag" --format='%(contents)') -join "`n").Trim() } # a lightweight tag has no message
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $h = @{}
          foreach ($f in $env:ZIP, 'SysWidget.exe', 'Setup.exe') { $h[$f] = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() }
          # 1) the summary (the widget reads it between the markers), 2) the full changelog link, 3) download + SHA-256
          $notes = ''
          if ($summary) { $notes += "<!--summary-->`n$summary`n<!--/summary-->`n`n" }
          if ($prev) { $notes += "**Full changelog**: https://github.com/${{ github.repository }}/compare/$prev...$tag`n`n" }
          $notes += "Download **$env:ZIP** below, extract it, then run **Setup.exe**.`n`nSHA-256:`n" +
                   "- ``$env:ZIP``: ``$($h[$env:ZIP])```n" +
                   "- ``SysWidget.exe``: ``$($h['SysWidget.exe'])```n" +
                   "- ``Setup.exe``: ``$($h['Setup.exe'])``" +
                   "`n`n[Code signing policy](https://syswidget.github.io/#code-signing-policy) · [Privacy policy](https://syswidget.github.io/privacy.html)"
          gh release create $tag $env:ZIP --title "SysWidget $tag" --notes $notes

  # Then send the new version to winget (see winget.yml).
  winget:
    needs: release
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
