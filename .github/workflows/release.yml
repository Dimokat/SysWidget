name: Release

# Push a tag like v1.1.0 -> builds SysWidget.exe + Setup.exe on Windows and publishes them as a zip in a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got ${{ github.ref_name }})" }
          foreach ($f in 'SysWidget.cs', 'Setup.cs') {
            $s = Get-Content $f -Raw
            $s = $s -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(""$v.0"")"
            $s = $s -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(""$v.0"")"
            if ($f -eq 'Setup.cs') { $s = $s -replace 'Version = "[^"]*"', "Version = ""$v""" }
            Set-Content $f $s -NoNewline
          }

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          $zip = "SysWidget-${{ github.ref_name }}.zip"
          New-Item pkg -ItemType Directory | Out-Null
          Copy-Item SysWidget.exe, Setup.exe, LICENSE pkg
          "Extract this folder, then run Setup.exe.`r`n`r`nSysWidget by Dimokat - https://github.com/Dimokat/SysWidget" | Set-Content pkg\README.txt
          Compress-Archive pkg\* $zip
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{}
          foreach ($f in $env:ZIP, 'SysWidget.exe', 'Setup.exe') { $h[$f] = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() }
          $notes = "Download **$env:ZIP** below, extract it, then run **Setup.exe**.`n`nSHA-256:`n" +
                   "- ``$env:ZIP``: ``$($h[$env:ZIP])```n" +
                   "- ``SysWidget.exe``: ``$($h['SysWidget.exe'])```n" +
                   "- ``Setup.exe``: ``$($h['Setup.exe'])``"
          gh release create '${{ github.ref_name }}' $env:ZIP --title 'SysWidget ${{ github.ref_name }}' --notes $notes --generate-notes
