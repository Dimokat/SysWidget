name: Release

# Push a tag like v1.1.0 -> builds SysWidget.exe + SysWidgetSetup.exe on Windows and publishes a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got ${{ github.ref_name }})" }
          foreach ($f in 'SysWidget.cs', 'Setup.cs') {
            $s = Get-Content $f -Raw
            $s = $s -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(""$v.0"")"
            $s = $s -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(""$v.0"")"
            if ($f -eq 'Setup.cs') { $s = $s -replace 'Version = "[^"]*"', "Version = ""$v""" }
            Set-Content $f $s -NoNewline
          }

      - name: Build
        shell: cmd
        run: build.bat

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash SysWidgetSetup.exe -Algorithm SHA256).Hash.ToLower()
          $notes = "Download **SysWidgetSetup.exe** below and run it.`n`nSHA-256 of SysWidgetSetup.exe: ``$hash``"
          gh release create '${{ github.ref_name }}' SysWidgetSetup.exe --title 'SysWidget ${{ github.ref_name }}' --notes $notes --generate-notes
